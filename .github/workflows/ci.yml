# Build and publish the two runtime images on every push to main.
#
# NO VERSION GATE, deliberately, and this differs from car-tracker on purpose.
# There, `latest` is a promoted release gated on a VERSION bump. Here `latest` is
# simply the head of main: merge it and it ships. Same tag name, same Watchtower
# on the other end, opposite amounts of ceremony - see docs/deployment.md.
#
# The consequence is worth saying out loud: questward is CONTINUOUSLY DEPLOYED.
# Watchtower on Asgard polls every 300 seconds, so a merge reaches production in
# under five minutes with nobody involved.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build but never push. The build IS the test: both runtime
      # stages come off one multi-stage Dockerfile, so a broken restore, a failed
      # `npm run build` or a missing COPY fails here rather than on main.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64      # Asgard is x64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/questward-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/questward-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: gateway
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/questward-gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/questward-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The sha tag is the ONLY rollback handle this pipeline produces. `latest`
      # has already moved by the time you want to go back, and the previous image
      # would otherwise have no name at all. Nothing consumes this tag routinely;
      # it costs one line and is the difference between a rollback and a rebuild.
      - name: Say what shipped
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published"
            echo ""
            echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/questward-api:latest\`"
            echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/questward-gateway:latest\`"
            echo ""
            echo "Roll back by pinning this sha in Arcane's environment:"
            echo ""
            echo '```'
            echo "QUESTWARD_API_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/questward-api:${{ github.sha }}"
            echo "QUESTWARD_GATEWAY_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/questward-gateway:${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
