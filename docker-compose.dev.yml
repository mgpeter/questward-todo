# Postgres only. Use this while running the API with `dotnet run` and the SPA with `npm run dev`.
#   docker compose -f docker-compose.dev.yml up -d
name: questward-dev

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: questward
      POSTGRES_USER: questward
      POSTGRES_PASSWORD: questward
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 sets PGDATA to /var/lib/postgresql/18/docker, so the volume goes one level up.
      - questward-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questward -d questward"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  questward-dev-data:
