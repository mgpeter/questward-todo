<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A self-hosted todo list that pays you in experience points." />
    <meta name="color-scheme" content="light dark" />
    <title>Questward</title>
    <script>
      // Applied before first paint so a dark-theme reload never flashes parchment.
      ;(function () {
        try {
          var stored = localStorage.getItem('questward.theme') || 'system'
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)

          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (error) {
          /* storage unavailable; the ThemeProvider settles it after hydration */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
